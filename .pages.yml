media:
- name: fotografije
  label: Fotografije putovanja i bloga
  input: images
  output: /images
  rename: safe
  categories:
  - image
- name: programi
  label: PDF programi putovanja
  input: putovanja
  output: /putovanja
  rename: safe
  extensions:
  - pdf
content:
- name: putovanja
  label: Putovanja – uređivanje na jednom mjestu
  type: file
  path: putovanja.json
  format: json
  list: true
  operations:
    delete: false
  fields:
  - name: naslov
    label: Naziv putovanja
    type: string
    required: true
  - name: termin
    label: Datum putovanja (ispod naslova)
    type: string
    description: Npr. 06.–18.03.2027. Ako nije potvrđen, ostavi prazno.
  - name: opis
    label: Kratki opis
    type: text
    required: true
  - name: cijena
    label: Cijena (tekst)
    type: string
    description: Npr. od 790 € ili na upit
  - name: slika
    label: Fotografija putovanja
    type: image
    options:
      media: fotografije
  - name: pdf
    label: PDF program putovanja (neobvezno)
    type: file
    options:
      media: programi
      extensions:
      - pdf
    description: Bez PDF-a na kartici će pisati Potraži i otvoriti kontakt-obrazac.
  - name: kategorija
    label: Kategorija (kao na originalnoj stranici)
    type: select
    required: true
    options:
      values:
      - name: europa
        label: Europska putovanja
      - name: hrvatska
        label: Hrvatska
      - name: advent
        label: Advent
      - name: citybreak
        label: City break
      - name: tematske
        label: Tematske ture
      - name: daleka
        label: Daleka putovanja
  - name: izdvojeno
    label: Izdvojeno na naslovnici (označi najviše 3)
    type: boolean
  - name: vidljivo
    label: Prikaži putovanje na stranici
    type: boolean
- name: novosti
  label: Blog i novosti – puni članci
  type: file
  path: novosti.json
  format: json
  list: true
  operations:
    delete: false
  fields:
  - name: id
    label: ID članka (automatski)
    type: uuid
    options:
      editable: false
  - name: naslov
    label: Naslov
    type: string
    required: true
  - name: datum
    label: Datum objave
    type: date
    required: true
  - name: kategorija
    label: Kategorija članka
    type: string
  - name: sazetak
    label: Uvod za karticu
    type: text
    required: true
  - name: slika
    label: Naslovna fotografija
    type: image
    options:
      media: fotografije
  - name: tekst
    label: Cijeli članak – piši ovdje
    type: rich-text
    required: true
    options:
      format: html
      media: fotografije
      switcher: false
  - name: objavljeno
    label: Objavi članak
    type: boolean
- name: pozadine
  label: Galerija pozadinskih fotografija
  type: file
  path: pozadine.json
  format: json
  list: true
  operations:
    delete: false
  fields:
  - name: slika
    label: Odaberi ili učitaj pozadinsku fotografiju
    type: image
    required: true
    options:
      media: fotografije
  - name: aktivna
    label: Uključi fotografiju u izmjenu
    type: boolean
    description: Kad isključiš, ta fotografija se neće prikazivati.
